<!-- Google Analytics 4 (GA4) Tracking -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XCPWM1YG2N"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XCPWM1YG2N', {
    page_path: window.location.pathname + window.location.search + window.location.hash
  });

  // Track story route navigation via popstate and hashchange
  function trackStoryView() {
    if (typeof gtag === 'function') {
      gtag('event', 'page_view', {
        page_title: document.title,
        page_location: window.location.href,
        page_path: window.location.pathname + window.location.search + window.location.hash
      });
    }
  }

  window.addEventListener('hashchange', trackStoryView);
  window.addEventListener('popstate', trackStoryView);
</script>
<style>
  body {
    font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
</style>
